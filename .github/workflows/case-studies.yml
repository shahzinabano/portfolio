name: Build case study pages

# Upload a PDF (and optionally a thumbnail) on github.com into
#   source-assets/case-studies/<name>/
# and this turns it into web pages for the site, then commits them.
# Vercel redeploys automatically from that commit.

on:
  push:
    branches: [main]
    paths:
      - "source-assets/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: case-study-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PDF renderer (poppler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Convert uploads into web pages
        run: npm run assets

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public src/data/generated.json
          # the raw PDFs and thumbnails are large and no longer needed once converted
          git ls-files -z 'source-assets/case-studies/*/*.pdf' 'source-assets/case-studies/*/*.PDF' 'source-assets/case-studies/*/thumb*' \
            | xargs -0 -r git rm -q --
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Build case study pages from uploaded files"
          git push
